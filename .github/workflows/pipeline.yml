name: Pipeline

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      service:
        description: 要重新部署的服务
        type: choice
        options: [all, gateway, image, search, reader, trends, amap, context7, weather]
        default: all

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPLOY_DIR: /home/heyanxiao/project/agent-tools
  # 镜像在 Windows 构建机上构建并推到 ACR（个人版，深圳），dev 只拉镜像部署。
  REGISTRY: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com
  IMAGE_PREFIX: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com/seanfield

jobs:
  changes:
    runs-on: [self-hosted, dev-agent-tools]
    outputs:
      gateway: ${{ steps.detect.outputs.gateway }}
      image: ${{ steps.detect.outputs.image }}
      search: ${{ steps.detect.outputs.search }}
      reader: ${{ steps.detect.outputs.reader }}
      trends: ${{ steps.detect.outputs.trends }}
      amap: ${{ steps.detect.outputs.amap }}
      context7: ${{ steps.detect.outputs.context7 }}
      weather: ${{ steps.detect.outputs.weather }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED: ${{ inputs.service }}
        run: |
          set -euo pipefail
          services="gateway image search reader trends amap context7 weather"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            for s in $services; do
              if [ "$REQUESTED" = "all" ] || [ "$REQUESTED" = "$s" ]; then v=true; else v=false; fi
              echo "$s=$v" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # 新分支或历史被改写时无法求差异，全部服务都跑一遍。
            changed=".github/"
          else
            changed=$(git diff --name-only "$base" HEAD)
          fi
          echo "$changed"
          for s in $services; do
            dir="services/$s/"
            [ "$s" = "gateway" ] && dir="gateway/"
            if echo "$changed" | grep -qE "^(${dir}|\.github/)"; then v=true; else v=false; fi
            echo "$s=$v" >> "$GITHUB_OUTPUT"
          done

  check-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    defaults:
      run:
        working-directory: gateway
    env:
      # 用 dev 系统自带的 Python 3.12，不从 GitHub 下载解释器（dev 拉 GitHub 发布包经常中断）。
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: ~/.local/bin/uv sync --frozen
      - name: Ruff
        run: |
          ~/.local/bin/ruff check .
          ~/.local/bin/ruff format --check .
      - name: Tests
        run: ~/.local/bin/uv run --frozen pytest -q

  check-amap:
    needs: changes
    if: needs.changes.outputs.amap == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    defaults:
      run:
        working-directory: services/amap
    env:
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: ~/.local/bin/uv sync --frozen
      - name: Ruff
        run: |
          ~/.local/bin/ruff check .
          ~/.local/bin/ruff format --check .
      - name: Tests
        run: ~/.local/bin/uv run --frozen pytest -q

  check-context7:
    needs: changes
    if: needs.changes.outputs.context7 == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    defaults:
      run:
        working-directory: services/context7
    env:
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: ~/.local/bin/uv sync --frozen
      - name: Ruff
        run: |
          ~/.local/bin/ruff check .
          ~/.local/bin/ruff format --check .
      - name: Tests
        run: ~/.local/bin/uv run --frozen pytest -q

  check-weather:
    needs: changes
    if: needs.changes.outputs.weather == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    defaults:
      run:
        working-directory: services/weather
    env:
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: ~/.local/bin/uv sync --frozen
      - name: Ruff
        run: |
          ~/.local/bin/ruff check .
          ~/.local/bin/ruff format --check .
      - name: Tests
        run: ~/.local/bin/uv run --frozen pytest -q

  check-image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    defaults:
      run:
        working-directory: services/image
    env:
      # 和 check-gateway 一样用 dev 系统自带的 Python 3.12，不下载解释器。
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - name: Ruff lint
        run: ~/.local/bin/ruff check .
      - name: Architecture check
        run: python3 scripts/check_architecture.py
      - name: Install dependencies
        run: ~/.local/bin/uv sync --frozen --extra dev
      - name: Tests
        run: ~/.local/bin/uv run --frozen pytest -q

  check-search:
    needs: changes
    if: needs.changes.outputs.search == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    defaults:
      run:
        working-directory: services/search
    env:
      # 和 check-gateway 一样用 dev 系统自带的 Python 3.12，不下载解释器。
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - name: Architecture check
        run: python3 scripts/check_architecture.py
      - name: Ruff lint
        run: ~/.local/bin/ruff check .
      - name: Install dependencies
        run: ~/.local/bin/uv sync --frozen
      - name: Tests
        run: ~/.local/bin/uv run --frozen pytest -q

  check-reader:
    needs: changes
    if: needs.changes.outputs.reader == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    defaults:
      run:
        working-directory: services/reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 不用 Actions 缓存：self-hosted 机器本地已有 pip 缓存
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest -v test_main

  publish:
    needs: [changes, check-gateway, check-image, check-search, check-reader, check-amap, check-context7, check-weather]
    if: >-
      always() && github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.gateway == 'true' || needs.changes.outputs.image == 'true' ||
       needs.changes.outputs.search == 'true' || needs.changes.outputs.reader == 'true' ||
       needs.changes.outputs.trends == 'true' || needs.changes.outputs.amap == 'true' ||
       needs.changes.outputs.context7 == 'true' || needs.changes.outputs.weather == 'true')
    runs-on: [self-hosted, Windows, X64, agent-tools-build]
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      SERVICES: >-
        ${{ needs.changes.outputs.gateway == 'true' && 'gateway,' || '' }}${{ needs.changes.outputs.image == 'true' && 'image,' || '' }}${{ needs.changes.outputs.search == 'true' && 'search,' || '' }}${{ needs.changes.outputs.reader == 'true' && 'reader,' || '' }}${{ needs.changes.outputs.trends == 'true' && 'trends,' || '' }}${{ needs.changes.outputs.amap == 'true' && 'amap,' || '' }}${{ needs.changes.outputs.context7 == 'true' && 'context7,' || '' }}${{ needs.changes.outputs.weather == 'true' && 'weather,' || '' }}
    steps:
      - name: Configure Docker credential directory
        # 构建机上的 Fusion runner 用同一个服务账号，凭据按任务隔离，互不覆盖。
        run: |
          $dockerConfig = Join-Path $env:RUNNER_TEMP ".docker-$env:GITHUB_RUN_ID-$env:GITHUB_JOB"
          New-Item -ItemType Directory -Force -Path $dockerConfig | Out-Null
          "DOCKER_CONFIG=$dockerConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Docker access
        run: |
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          docker version
          if ($LASTEXITCODE -ne 0) { Write-Host "Docker Engine is unavailable on this runner."; exit $LASTEXITCODE }
      - name: Login to ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          # 凭据目录由最后一步统一删除。
          logout: false
      - name: Build and push images
        env:
          HTTP_PROXY: http://127.0.0.1:7897
          HTTPS_PROXY: http://127.0.0.1:7897
          NO_PROXY: localhost,127.0.0.1,::1
        timeout-minutes: 30
        run: |
          & ".github/scripts/windows-publish.ps1" -Services "${env:SERVICES}" -ImagePrefix "${env:IMAGE_PREFIX}" -ImageTag "${env:GITHUB_SHA}"
      - name: Cleanup local images and credentials
        if: always()
        run: |
          foreach ($service in ($env:SERVICES -split "," | Where-Object { $_ })) {
            docker image rm "${env:IMAGE_PREFIX}/agent-tools-${service}:${env:GITHUB_SHA}" 2>$null
          }
          if ($env:DOCKER_CONFIG -and (Test-Path $env:DOCKER_CONFIG)) { Remove-Item -Recurse -Force $env:DOCKER_CONFIG }
          exit 0

  # 三个服务共用 dev 上的一份部署目录（.env 与生图存储不入库），先同步到本次提交再分别部署。
  sync:
    needs: [changes, check-gateway, check-image, check-search, check-reader, check-amap, check-context7, check-weather]
    if: >-
      always() && github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: [self-hosted, dev-agent-tools]
    steps:
      - name: Sync deploy checkout
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git fetch -q origin main
          git checkout -q --detach "$GITHUB_SHA"
          git log --oneline -1
      - name: Ensure private network
        run: |
          set -euo pipefail
          # search / reader 只在这个网络里；不能用 --internal，它们要访问外网。
          docker network inspect agent-tools-internal >/dev/null 2>&1 || docker network create agent-tools-internal
          # 网关先接入，避免 search / reader 先切网络、网关还没部署时转发中断（compose 部署后保持一致）。
          if docker inspect agent-tools-gateway >/dev/null 2>&1 && \
             ! docker inspect agent-tools-gateway --format '{{json .NetworkSettings.Networks}}' | grep -q '"agent-tools-internal"'; then
            docker network connect agent-tools-internal agent-tools-gateway
          fi

  deploy-image:
    needs: [changes, sync, publish]
    if: always() && needs.sync.result == 'success' && needs.publish.result == 'success' && needs.changes.outputs.image == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    steps:
      - name: Record start time
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Deploy
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash "$DEPLOY_DIR/.github/scripts/deploy-from-acr.sh" image
      - name: Health check
        run: |
          # compose up 在应用就绪前就返回；容器反复崩溃必须让部署失败。
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8090/v1/health; then
              echo; echo "healthy after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "image-service did not become healthy within 60s"
          docker logs --tail 50 image-service
          exit 1
      - name: Push deploy metrics
        if: always()
        run: timeout 15s bash ~/scripts/push-deploy-metrics.sh image-service main "${{ job.status }}" "${{ env.BUILD_START }}" || echo "deploy metrics push failed, ignored"

  deploy-search:
    needs: [changes, sync, publish, deploy-image]
    if: always() && needs.sync.result == 'success' && needs.publish.result == 'success' && needs.changes.outputs.search == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    steps:
      - name: Record start time
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Deploy
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash "$DEPLOY_DIR/.github/scripts/deploy-from-acr.sh" search
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if docker exec search-service python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"; then
              echo "healthy after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "search-service did not become healthy within 60s"
          docker logs --tail 50 search-service
          exit 1
      - name: Push deploy metrics
        if: always()
        run: timeout 15s bash ~/scripts/push-deploy-metrics.sh search-service main "${{ job.status }}" "${{ env.BUILD_START }}" || echo "deploy metrics push failed, ignored"

  deploy-reader:
    needs: [changes, sync, publish, deploy-search]
    if: always() && needs.sync.result == 'success' && needs.publish.result == 'success' && needs.changes.outputs.reader == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    steps:
      - name: Deploy
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash "$DEPLOY_DIR/.github/scripts/deploy-from-acr.sh" reader
      - name: Health check
        run: |
          # reader 不再暴露端口，在容器内检查。
          for i in $(seq 1 15); do
            if docker exec reader-service python -c "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=3)"; then
              echo "healthy after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "reader-service did not become healthy within 30s"
          docker logs --tail 50 reader-service
          exit 1
      - name: Functional read smoke
        run: docker exec -i reader-service python - < "$DEPLOY_DIR/services/reader/scripts/smoke_read.py"

  deploy-trends:
    needs: [changes, sync, publish, deploy-reader]
    if: always() && needs.sync.result == 'success' && needs.publish.result == 'success' && needs.changes.outputs.trends == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    steps:
      - name: Deploy
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash "$DEPLOY_DIR/.github/scripts/deploy-from-acr.sh" trends
      - name: MCP smoke
        run: |
          # 没有健康检查接口，用一次 MCP 握手 + 查询确认服务可用且读得到数据。
          for i in $(seq 1 15); do
            if docker exec -i trends-mcp python - < "$DEPLOY_DIR/services/trends/scripts/smoke_mcp.py"; then
              echo "ready after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "trends-mcp did not become ready within 30s"
          docker logs --tail 50 trends-mcp
          exit 1

  deploy-amap:
    needs: [changes, sync, publish, deploy-trends]
    if: always() && needs.sync.result == 'success' && needs.publish.result == 'success' && needs.changes.outputs.amap == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    steps:
      - name: Deploy
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash "$DEPLOY_DIR/.github/scripts/deploy-from-acr.sh" amap
      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if docker exec amap-mcp python -c "import urllib.request; urllib.request.urlopen('http://localhost:3334/health', timeout=3)"; then
              echo "healthy after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "amap-mcp did not become healthy within 30s"
          docker logs --tail 50 amap-mcp
          exit 1
      - name: MCP smoke
        # 用真实密钥调一次 maps_geo，确认白名单生效且能连通高德。
        run: docker exec -i amap-mcp python - < "$DEPLOY_DIR/services/amap/scripts/smoke_mcp.py"

  deploy-context7:
    needs: [changes, sync, publish, deploy-amap]
    if: always() && needs.sync.result == 'success' && needs.publish.result == 'success' && needs.changes.outputs.context7 == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    steps:
      - name: Deploy
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash "$DEPLOY_DIR/.github/scripts/deploy-from-acr.sh" context7
      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if docker exec context7-mcp python -c "import urllib.request; urllib.request.urlopen('http://localhost:3335/health', timeout=3)"; then
              echo "healthy after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "context7-mcp did not become healthy within 30s"
          docker logs --tail 50 context7-mcp
          exit 1
      - name: MCP smoke
        # 用真实密钥调一次 resolve-library-id，确认白名单生效且能连通 Context7。
        run: docker exec -i context7-mcp python - < "$DEPLOY_DIR/services/context7/scripts/smoke_mcp.py"

  deploy-weather:
    needs: [changes, sync, publish, deploy-context7]
    if: always() && needs.sync.result == 'success' && needs.publish.result == 'success' && needs.changes.outputs.weather == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    steps:
      - name: Deploy
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash "$DEPLOY_DIR/.github/scripts/deploy-from-acr.sh" weather
      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if docker exec weather-service python -c "import urllib.request; urllib.request.urlopen('http://localhost:8092/health', timeout=3)"; then
              echo "healthy after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "weather-service did not become healthy within 30s"
          docker logs --tail 50 weather-service
          exit 1
      - name: Forecast smoke
        # 用真实凭证查一次北京的城市与逐日预报，确认凭证有效且能连通和风。
        run: docker exec -i weather-service python - < "$DEPLOY_DIR/services/weather/scripts/smoke_weather.py"

  deploy-gateway:
    needs: [changes, sync, publish, deploy-reader, deploy-trends, deploy-amap, deploy-context7, deploy-weather]
    if: always() && needs.sync.result == 'success' && needs.publish.result == 'success' && needs.changes.outputs.gateway == 'true'
    runs-on: [self-hosted, dev-agent-tools]
    steps:
      - name: Record start time
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Deploy
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash "$DEPLOY_DIR/.github/scripts/deploy-from-acr.sh" gateway
      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8100/health; then
              echo; echo "healthy after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "gateway did not become healthy within 30s"
          docker logs --tail 50 agent-tools-gateway
          exit 1
      - name: Push deploy metrics
        if: always()
        run: timeout 15s bash ~/scripts/push-deploy-metrics.sh agent-tools-gateway main "${{ job.status }}" "${{ env.BUILD_START }}" || echo "deploy metrics push failed, ignored"
