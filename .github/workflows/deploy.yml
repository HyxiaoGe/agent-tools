name: Deploy to Dev Server
on:
  push:
    branches: ["master"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest -v test_main
      - name: Sync deploy checkout
        run: |
          cd ~/project/fusion/reader-service && git fetch origin && git reset --hard origin/master && git clean -fd
      - name: Build and deploy
        run: |
          cd ~/project/fusion/reader-service
          docker build -t reader-service .
          docker stop reader-service || true
          docker rm reader-service || true
          docker run -d \
            --name reader-service \
            --restart always \
            --network middleware_default \
            -p 8091:8091 \
            -e JINA_API_KEY=${{ secrets.JINA_API_KEY }} \
            -e TAVILY_API_KEYS=${{ secrets.TAVILY_API_KEYS }} \
            -e FIRECRAWL_API_KEYS=${{ secrets.FIRECRAWL_API_KEYS }} \
            reader-service
      - name: Health check
        run: |
          sleep 3
          curl -sf http://localhost:8091/health || exit 1
      - name: Functional read smoke
        run: |
          cd ~/project/fusion/reader-service
          python scripts/smoke_read.py
      - name: Cleanup
        run: |
          docker image prune -f
