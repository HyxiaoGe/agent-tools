name: reader-service
services:
  reader-service:
    build: .
    image: reader-service
    container_name: reader-service
    env_file: .env
    # 不对外暴露端口：只有 agent-tools 网关经专用网络访问。
    restart: always
    networks:
      - agent-tools

networks:
  agent-tools:
    external: true
    name: agent-tools-internal
