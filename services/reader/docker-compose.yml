name: reader-service
services:
  reader-service:
    build: .
    # dev 部署时由 deploy-from-acr.sh 传入本次提交的镜像（agent-tools/<服务>:<短 SHA>）；未传时用当前已部署的版本，本地开发会按 build 构建。
    image: ${AGENT_TOOLS_IMAGE:-agent-tools/reader:current}
    container_name: reader-service
    env_file: .env
    # 不对外暴露端口：只有 agent-tools 网关经专用网络访问。
    restart: always
    networks:
      - agent-tools

networks:
  agent-tools:
    external: true
    name: agent-tools-internal
