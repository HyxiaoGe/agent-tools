[project]
name = "agent-tools-tmap"
version = "0.1.0"
description = "腾讯地图（腾讯位置服务）官方 MCP 的代理：服务端注入密钥、只读工具白名单"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4,<5",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
