name: image-service
services:
  image-service:
    build: .
    # dev 部署时由 deploy-from-acr.sh 传入本次提交的镜像（agent-tools/<服务>:<短 SHA>）；未传时用当前已部署的版本，本地开发会按 build 构建。
    image: ${AGENT_TOOLS_IMAGE:-agent-tools/image:current}
    container_name: image-service
    network_mode: host
    env_file:
      - .env
    environment:
      - ENV=production  # JSON logs for Loki; local dev keeps the console renderer
      - HTTP_PROXY=http://127.0.0.1:7897
      - HTTPS_PROXY=http://127.0.0.1:7897
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      - ./storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
