# 公网入口沿用香港 Nginx 的 SNI 转发和现有 SSH 反向隧道。
# 首次签发证书前只安装 HTTP 段；证书就绪后再启用 HTTPS 段。
server {
    listen 80;
    server_name agent-tools.seanfield.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 8443 ssl proxy_protocol;
    # 仅接受现有公网隧道所在网络发来的 PROXY protocol 地址。
    set_real_ip_from 172.28.0.0/16;
    real_ip_header proxy_protocol;
    http2 on;
    server_name agent-tools.seanfield.org;
    ssl_certificate /etc/letsencrypt/live/agent-tools.seanfield.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent-tools.seanfield.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:playground_ssl:1m;
    ssl_session_timeout 1d;
    client_max_body_size 64k;

    location / {
        set $playground_upstream agent-tools-playground;
        proxy_pass http://$playground_upstream:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端自行提交的地址，只转交代理确认的访客地址。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 190s;
        proxy_buffering off;
        proxy_cache off;
    }
}
