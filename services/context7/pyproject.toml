[project]
name = "agent-tools-context7"
version = "0.1.0"
description = "Context7 官方 MCP 的代理：服务端注入密钥、文档工具白名单、限流标记"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
