name: search-service
services:
  search-service:
    build: .
    # dev 部署时由 deploy-from-acr.sh 传入 ACR 镜像；未传时用当前已部署的版本，本地开发会按 build 构建。
    image: ${AGENT_TOOLS_IMAGE:-agent-tools/search:current}
    container_name: search-service
    env_file: .env
    environment:
      # search 自己的 redis（缓存 + Firecrawl 每日用量计数），不再用共享的 middleware-redis。
      - REDIS_URL=redis://search-redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    depends_on:
      - search-redis
    networks:
      - default
      - agent-tools

  search-redis:
    image: redis:7-alpine
    container_name: search-redis
    # 用量计数要留存，开 AOF；只在本项目 default 网络内可达。
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - search-redis-data:/data
    deploy:
      resources:
        limits:
          memory: 96M
    restart: unless-stopped
    networks:
      - default

volumes:
  search-redis-data:

networks:
  agent-tools:
    external: true
    name: agent-tools-internal
