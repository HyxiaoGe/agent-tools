<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  字体列表里点名表情字体的，把这个名字拿掉（装到 /etc/fonts/conf.d/44-sandbox-emoji.conf，要排在 45-generic.conf 前面）。

  不拿掉的话：系统自带的 45-generic.conf 见到这些名字，就给整段文字加上“表情”的语言标记，60-generic.conf 再据此要求彩色字体，
  而彩色比字体名的先后更优先，结果表情字体排到了最前面。它里面有 0-9、#、* 和空格的字形（拼键帽表情用的，很宽），
  正文里的“1000”就成了“１ ０ ０ ０”。网页里常见的写法（font-family 末尾列上 "Apple Color Emoji", "Segoe UI Emoji",
  "Noto Color Emoji"）都会踩到。

  拿掉以后表情照样是彩色的：Pango 给表情单独分段、单独找表情字体，不靠这里的点名。键帽表情（1️⃣）也正常。
  2026-11-12 在 dev 上 gVisor 里实测过点名、不点名、只写表情字体几种写法。
-->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Apple Color Emoji</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Segoe UI Emoji</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Twitter Color Emoji</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>EmojiOne Mozilla</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Emoji Two</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>JoyPixels</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Emoji One</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Noto Emoji</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Android Emoji</string></test>
    <edit name="family" mode="delete"/>
  </match>
</fontconfig>
