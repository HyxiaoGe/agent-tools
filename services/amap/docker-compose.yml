name: amap
services:
  amap-mcp:
    build: .
    # dev 部署时由 deploy-from-acr.sh 传入本次提交的镜像（agent-tools/<服务>:<短 SHA>）；未传时用当前已部署的版本，本地开发会按 build 构建。
    image: ${AGENT_TOOLS_IMAGE:-agent-tools/amap:current}
    container_name: amap-mcp
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
      - MCP_PORT=3334
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    # 自身无鉴权，只在专用网络里，经网关 /amap/mcp 访问；要访问公网的高德，网络不能是 internal。
    networks:
      - agent-tools

networks:
  agent-tools:
    external: true
    name: agent-tools-internal
