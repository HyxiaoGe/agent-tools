services:
  image-service:
    build: .
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - HTTP_PROXY=http://host.docker.internal:7897
      - HTTPS_PROXY=http://host.docker.internal:7897
      - NO_PROXY=redis,localhost,127.0.0.1
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - middleware
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - middleware
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:

networks:
  middleware:
    external: true
